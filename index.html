<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>店舗POS</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1D4E4B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="店舗POS" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />

<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }
  html, body, #root {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    background: #EFEBE2;
  }
  input, textarea {
    -webkit-user-select: text;
    user-select: text;
  }
  #offline-banner {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    background: #C98A2B;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    font-size: 12.5px;
    text-align: center;
    padding: 4px 0;
    z-index: 9999;
  }
  #offline-banner.show { display: block; }
  #boot-loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    color: #5B6459;
    background: #EFEBE2;
  }
  /* アドレスバーの出し引きでビューポート高さが変動する端末でも
     コンテンツが隠れないよう、対応ブラウザでは動的ビューポート単位を使う */
  @supports (height: 100dvh) {
    .pos-app-shell { height: 100dvh !important; }
  }
</style>
</head>
<body>

<div id="offline-banner">オフラインで動作中です(この端末に保存されたデータを使用しています)</div>
<div id="root"><div id="boot-loading">読み込み中…</div></div>

<!-- React (CDN経由で読み込み、初回アクセス後はService Workerがオフライン配信) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>

<script>
  // オンライン/オフライン状態の表示
  function updateOnlineState() {
    document.getElementById('offline-banner').classList.toggle('show', !navigator.onLine);
  }
  window.addEventListener('online', updateOnlineState);
  window.addEventListener('offline', updateOnlineState);
  updateOnlineState();

  // Service Worker登録(オフライン動作の要)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch((err) => {
        console.error('Service worker registration failed:', err);
      });
    });
  }
</script>

<script type="text/babel" src="./app.jsx"></script>
<script type="text/babel" src="./ledger.jsx"></script>
<script type="text/babel" src="./payroll.jsx"></script>

</body>
</html>
